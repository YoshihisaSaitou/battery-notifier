      versionName 1.0, debug signing configuration.
  - id: "IMP-BN009-007"
    type: "implementation_impact_analysis"
    summary: >-
      Visible status is now optional in SHORT_TEXT, RANGED_VALUE, and LONG_TEXT.
      Fresh charging omits title, while localized charging remains in the
