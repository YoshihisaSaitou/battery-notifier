handoff:
  from_role: "specification"
  to_role: "implementation"
  summary: >-
    Version 1 uses fixed state and event DataItem paths, sequence-first ordering,
    local Proto DataStore on both devices, a five-minute stale boundary, and a
    five-minute notification-event expiry. The implementation role must first
    read all spec_refs, assign an actor, and resolve or explicitly defer DEC-001.
  first_action: >-
    Implement the Mobile domain models and Proto DataStore schema with boundary
    unit tests before adding Data Layer side effects.

next_actions:
  - "Human selects or approves the common application ID in DEC-001."
  - "Implementation wires MobileSyncCoordinator to battery changes, settings changes, reconnection, manual Mobile sync, and restart recovery entry points to finish IMP-003."
  - "Implementation proceeds with IMP-005 Wear app, Tile, complication, and notification surfaces using the persisted IMP-004 state."
  - "Implementation completes remaining IMP-006 receiver, freshness, and notification tests and records exact evidence."
  - "Run RealMobileDataStoreInstrumentedTest on an attached emulator or device."
  - "After implementation exit evidence is complete, assign an independent reviewer actor different from codex and use the prepared checklist."

