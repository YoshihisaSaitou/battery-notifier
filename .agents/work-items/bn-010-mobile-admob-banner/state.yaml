transition_matrix:
  authoritative_writer: >-
    UMP is authoritative for consent and privacy-options requirement. The
    process-local MobileAdsGate is authoritative only for SDK initialization
    progress and derived banner visibility; no BN-010 state is persisted.
  persistence_boundary: >-
    None. UMP/Google SDKs own their internal consent storage. Battery Notifier
    Proto DataStore, Wear Data Layer, and saved instance state do not store ad
    IDs, consent strings, or initialization state.
  states:
    consent: ["cannot_request", "can_request"]
    initialization: ["not_started", "initializing", "ready", "failed"]
    banner: ["hidden", "visible"]
  invariants:
    - "banner visible iff consent=can_request and initialization=ready"
    - "initialization starts at most once per application process"
    - "consent=false never starts SDK initialization and always hides/destroys the banner"
    - "initialization failure keeps the banner hidden and never blocks battery features"
    - "Activity recreation observes the application-process gate and does not start a duplicate initialization"
  transitions:
    - input: "consent update false or revoked"
      from: "any initialization state"
      to: "consent=cannot_request; initialization unchanged; banner=hidden"
      side_effect: "destroy composed AdView; no MobileAds initialization or ad request"
    - input: "first consent update true"
      from: "initialization=not_started"
      to: "consent=can_request; initialization=initializing; banner=hidden"
      side_effect: "start MobileAds.initialize exactly once"
    - input: "duplicate consent update true"
      from: "initialization=initializing, ready, or failed"
      to: "initialization unchanged; banner visible only when ready"
      side_effect: "no duplicate initialization"
    - input: "MobileAds initialization callback"
      from: "initialization=initializing"
      to: "initialization=ready; banner visible only if consent remains can_request"
      side_effect: "compose one banner, whose factory performs one main-thread loadAd"
    - input: "MobileAds initialization throws"
      from: "initialization=initializing"
      to: "initialization=failed; banner=hidden"
      side_effect: "no retry in the same process; battery features continue"
    - input: "Activity/configuration recreation"
      from: "any process-local gate state"
      to: "same application gate state; banner re-composed only when derived visible"
      side_effect: "old AdView destroyed; no duplicate SDK initialization"
    - input: "process recreation"
      from: "process terminated"
      to: "initialization=not_started; banner=hidden until fresh UMP update"
      side_effect: "perform the launch consent flow again"

