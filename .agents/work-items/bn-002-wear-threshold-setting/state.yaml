  slug: "bn-002-wear-threshold-setting"
  title: "Wear-initiated notification threshold setting"
  scope: >-
    Let the user request a 5..100 percent notification-threshold change from
    the Wear app while Mobile remains the only authoritative settings writer.
    Define request/result messaging, validation, idempotency, conflict handling,
    disconnected behavior, localized UI, and implementation/test gates.

