  review:
    status: "changes_requested"
    owner: "/root/independent_review"
    preparation:
      status: "fixes_ready_for_independent_reviewer"
      checklist: ".agents/work-items/bn-001-phone-to-watch-battery-sync/review-checklist.md"
      independence_requirement: >-
