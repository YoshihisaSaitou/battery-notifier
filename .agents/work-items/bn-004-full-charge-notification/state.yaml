decisions_needed:
  - id: "DEC-006"
    owner: "specification"
    status: "resolved"
    question: "What is the safe default for existing and new installations?"
    decision: >-
      Default full-charge notifications to disabled so an update does not begin
      producing a new notification class without an explicit user opt-in.
  - id: "DEC-007"
    owner: "specification"
    status: "resolved"
    question: "How is duplicate notification within one charging session prevented?"
    decision: >-
      Arm only after a charging session is observed below 100 percent, emit on
      the first below-100 to 100 transition while charging, and do not re-arm
      until a non-charging state followed by a new below-100 charging session.

