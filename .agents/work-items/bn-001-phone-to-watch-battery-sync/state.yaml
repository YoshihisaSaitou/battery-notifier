      - id: "RV-013"
        severity: "Medium"
        status: "fixed"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/domain/presentation/WearDisplayState.kt"
        location: "negative age mapping lines 52-68 and MainActivity stale age rendering"
