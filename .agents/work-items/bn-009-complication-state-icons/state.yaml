      Android Developers Expose data to complications, verified 2026-08-11,
      states that the data source service icon represents the provider and is
      shown in the complication picker. The service currently lacks android:icon.
    url: "https://developer.android.com/training/wearables/complications/exposing-data"
  - id: "HUM-BN009-015"
    type: "human_approval"
    summary: >-
      Human approved the proposed app-identity picker specification on
      2026-08-11: dedicated 24dp white vector, same launcher silhouette, with
