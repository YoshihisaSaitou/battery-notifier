risks:
  - id: "RISK-001"
    severity: "medium"
    summary: "Application IDs now match, but installed Mobile/Wear signature equality still requires end-to-end verification."
    mitigation: "Test matching debug builds from the shared debug identity and matching Play-signed release artifacts; never mix debug and release."
  - id: "RISK-002"
    severity: "high"
    summary: "The continuous battery-monitoring specialUse FGS requires Google Play policy review and declaration evidence."
    mitigation: "Before publication, complete the Play Console FGS declaration, explanation, demo video, and policy confirmation approved in DEC-002."
  - id: "RISK-003"
    severity: "medium"
    summary: "Disconnected event delivery can create a misleading late Wear notification."
    mitigation: "Enforce event expiry and verify reconnect before/after expiry."

