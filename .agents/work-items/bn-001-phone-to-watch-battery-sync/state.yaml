handoff:
  from_role: "specification"
  to_role: "implementation"
  summary: >-
    Version 1 uses fixed state and event DataItem paths, sequence-first ordering,
    local Proto DataStore on both devices, a five-minute stale boundary, and a
    five-minute notification-event expiry. The implementation role must first
    read all spec_refs, assign an actor, and resolve or explicitly defer DEC-001.
  first_action: >-
    Implement the Mobile domain models and Proto DataStore schema with boundary
    unit tests before adding Data Layer side effects.

