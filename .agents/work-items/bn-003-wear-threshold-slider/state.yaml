risks:
  - id: "RSK-012"
    summary: >-
      A 96-value range is dense on a round screen; the Wear-native slider must
      remain non-segmented and retain one-percent tap adjustment.
    mitigation: >-
      Use androidx.wear.compose.material InlineSlider, explicit range semantics,
      localized controls, and required 41/45 mm accessibility verification.
  - id: "RSK-013"
    summary: >-
      Crown-based threshold adjustment conflicts with ScalingLazyColumn
      scrolling.
    mitigation: >-
      Human decision removes rotary capture from the threshold editor. Crown
      input remains available for ordinary screen scrolling.

review_findings:
  - id: "RV-011-001"
    severity: "Medium"
    status: "verified_fixed"
    file: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:189
    related_locations:
      - >-
        BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:578
      - >-
        BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:597
    requirements:
      - "FR-007"
      - "AC-018"
      - "TC-U031"
      - "TC-E084"
    summary: >-
      Rapid tap or rotary events can collapse because each handler derives the
      next value from thresholdDraftPercent supplied by the last DataStore Flow
      recomposition, while onThresholdDraftChange launches asynchronous
      persistence without an immediate local authoritative draft update.
    reproduction: >-
      Start editing at 20 percent and deliver two positive rotary events, or
      two increase taps, before the first updateDraft transaction is emitted
      back through repository.state and recomposes the InlineSlider. Both
      callbacks observe 20 and request 21, so the durable draft can finish at
      21 rather than the required 22; explicit Save then sends that collapsed
      final value.
    required_outcome: >-
      Serialize adjustment against the latest accepted draft, or update an
      editor-local authoritative draft synchronously before asynchronous
      persistence, so every accepted tap/rotary event advances exactly one
      percent and Save cannot overtake the final adjustment. Add a deterministic
      actual-handler fixture proving two positive events produce 20 -> 21 -> 22,
      boundaries remain 5/100, no request is sent during adjustment, and Save
      sends 22 exactly once.
    disposition: >-
      Must fix before Test because the defect affects the central one-percent
      continuous-input behavior; return to Implementation and independently
      re-review the fix.
    resolution: >-
      ThresholdDraftEditSession now owns each accepted value synchronously,
      while ThresholdDraftCommandQueue processes draft persistence and explicit
      Save in UI-event order. Save persists the session's authoritative value
      immediately before invoking the existing controller request path.
    resolution_evidence:
      - "CHK-BN003-007"
      - "CHK-BN003-008"
      - "CHK-BN003-RV011-003"
    verification: >-
      Independent re-review traced the production ThresholdDraftEditSession and
      ordered queue and reran 12 targeted tests. Two positive events update the
      synchronous session 20 -> 21 -> 22, queued persistence precedes Save,
      adjustment sends zero gateway requests, and the explicit Save path sends
      the final 22 exactly once while the composition remains alive.
  - id: "RV-011-002"
    severity: "Medium"
    status: "verified_fixed"
    file: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:103
    related_locations:
      - >-
        BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:108
      - >-
        BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:119
      - >-
        BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/ThresholdDraftEditSession.kt:67
      - >-
        BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/ThresholdDraftEditSession.kt:101
    requirements:
      - "W-005"
      - "NFR-016"
      - "FR-009"
      - "AC-018"
      - "TC-E084"
    summary: >-
      ThresholdDraftEditSession is remember-only and ThresholdDraftCommandQueue
      runs in rememberCoroutineScope. When composition is disposed, close only
      closes the channel and the same composition scope is cancelled without
      joining or durably transferring queued commands, so an in-flight final
      draft or Save can be lost during Activity recreation/process teardown.
    reproduction: >-
      Edit 20 -> 21 -> 22 and immediately rotate/recreate the Activity, or tap
      Save and recreate before DataStore update/save completes. The session is
      not rememberSaveable and onDispose closes the queue while its worker is
      cancelled with the composition scope. The next Activity can restore an
      older persisted draft, and a queued Save may never create a pending
      request or MessageClient send even though the user tapped Save.
    required_outcome: >-
      Move command ownership to a lifecycle boundary that guarantees accepted
      draft/Save commands are durably handed off before composition cancellation,
      and preserve the authoritative editing value across Activity recreation.
      Add a deterministic cancellation/recreation fixture with a suspended
      persist action proving the final 22 is restored and a tapped Save is
      processed exactly once, while passive recreation never auto-sends an
      unsaved draft and ADR-015 explicit-retry behavior remains unchanged.
    disposition: >-
      Must fix before Test because W-005 and NFR-016 explicitly require editable
      input persistence across Activity recreation, and loss of a tapped Save is
      user-intent loss in a central settings flow. Return to Implementation for
      lifecycle ownership and regression coverage, then independently re-review.
    resolution: >-
      ThresholdDraftCommandQueue is now owned by BatteryNotifierWearApplication's
      process scope rather than Composition. ThresholdDraftEditorState snapshots
      editing, draft, and an unacknowledged explicit-Save intent through
      ComponentActivity SavedStateRegistry. Controller Save atomically prepares
      the authoritative final draft and pending request before gateway send; a
      restored intent replays only when no durable pending/status exists.
    resolution_evidence:
      - "CHK-BN003-009"
      - "CHK-BN003-010"
      - "CHK-BN003-RV011-006"
    verification: >-
      Independent re-review confirmed application-process ownership, restored
      explicit-Save intent, atomic final-draft plus pending preparation, and the
      pending/status guard that prevents reconnect/recreation auto-retry. The
      actual cancellation fixture and controller paths send final 22 exactly
      once; the independent targeted rerun passed 16/16.
  - id: "RV-011-003"
    severity: "Medium"
    status: "verified_fixed"
    file: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:94
    related_locations:
      - >-
        BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:126
      - >-
        BatteryNotifierAndroidWearApp/app/src/test/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/ThresholdDraftEditSessionTest.kt:75
      - >-
        docs/wear-os-display-specification.md:93
    requirements:
      - "W-005"
      - "NFR-016"
      - "ADR-015"
    summary: >-
      SavedStateRegistry restores an unsaved editing draft into local editor
      state after process-scope cancellation, but MainActivity replays only a
      pending explicit-Save intent. It never re-enqueues the restored unsaved
      draft for Wear Proto persistence, so restored UI state and the durable
      draft can diverge.
    reproduction: >-
      Start from durable draft 20, adjust rapidly to 21 then 22 while the first
      persist action is suspended, save the Activity snapshot, cancel the
      application process scope, and recreate the application and Activity from
      the snapshot without tapping Save. The UI restores editing draft 22 and
      sends zero MessageClient requests, but the replacement queue receives no
      persist command and Wear Proto remains 20. A later process/device restart
      without that Activity saved state therefore restores 20 and loses 22.
    required_outcome: >-
      When an editing draft is restored and no explicit-Save intent is pending,
      durably reconcile that restored final draft into Wear Proto without sending
      a threshold-change request or triggering retry. Add a deterministic
      process-scope cancellation/recreation fixture with a suspended persist that
      asserts durable draft 22, zero gateway sends, and unchanged pending/status;
      retain the existing pending/status no-auto-resend guard and explicit retry.
    disposition: >-
      Must fix before Test because W-005 explicitly requires the draft to survive
      Wear process and device restart. Return to Implementation and independently
      re-review the passive-process-recreation persistence fixture.
    resolution: >-
      MainActivity now asks ThresholdDraftEditorState to re-enqueue only a restored
      editing draft with no explicit-Save intent. The application-owned ordered
      queue persists that value through the existing repository transaction and
      never invokes Save or retry. Active pending/status states remain protected by
      the repository transaction and are not overwritten or re-sent.
    resolution_evidence:
      - "CHK-BN003-011"
      - "CHK-BN003-012"
      - "CHK-BN003-013"
    verification: >-
      Independent re-review traced MainActivity restore into the application-owned
      ordered queue, controller updateDraft, and the repository transaction. Actual
      fixtures prove 20 -> 21 -> 22, process-scope cancellation, restored durable
      draft 22 with zero sends and null/IDLE request state, duplicate Activity
      reconciliation with zero sends, explicit-Save exclusion and one Save of 22,
      and SEND_FAILED pending/status preservation. The independent targeted plus
      repository rerun passed 40/40.
  - id: "RV-012-001"
    severity: "Medium"
    status: "verified_fixed"
    file: >-
      BatteryNotifierAndroidWearApp/app/src/test/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/ThresholdDraftEditSessionTest.kt:46
    related_locations:
      - >-
        BatteryNotifierAndroidWearApp/app/src/androidTest/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/ThresholdDraftSliderInstrumentedTest.kt:44
    requirements:
      - "FR-007"
      - "AC-018"
      - "TC-U031"
    summary: >-
      Removing the rotary-only boundary helper tests also removed deterministic
      actual-editor JVM coverage for TC-U031's current=100 input. The retained
      editor test starts at 5 and proves only 5 -> 5 -> 6, while the unexecuted
      Compose fixture uses a local Int instead of ThresholdDraftEditorState, the
      ordered queue, or Proto persistence and checks only that increase is disabled
      at 100. No fixture proves that decrease at 100 produces and persists 99.
    reproduction: >-
      Regress ThresholdDraftEditorState.stepBy at the upper boundary so an increase
      from 100 is persisted as a duplicate, or a decrease from 100 does not produce
      99. The independently executed editor/controller/repository suite still
      passes because no actual editor fixture starts at 100; the Compose fixture is
      not runtime evidence and does not exercise 100 -> 99 or durable persistence.
    required_outcome: >-
      Add a deterministic JVM fixture using the actual ThresholdDraftEditorState
      and ordered persistence path, starting at 100. Assert that stepBy(+1) keeps
      draft 100 without enqueuing duplicate persistence or sending a request, then
      stepBy(-1) changes the draft to 99 and persists exactly 99 with zero sends.
      Retain the existing 5- and 20-percent fixtures and explicit-Save assertions.
    disposition: >-
      Must fix before Test because TC-U031 explicitly requires current=5/20/100 and
      the missing upper-boundary decrement is core one-percent slider behavior.
      Return to Implementation and independently re-review the added fixture.
    resolution_evidence:
      - "CHK-BN003-018"
      - "CHK-BN003-019"
      - "CHK-BN003-020"
    verification: >-
      Independent re-review inspected and executed the actual
      ThresholdDraftEditorState plus ThresholdDraftCommandQueue fixture at 100.
      It asserts +1 keeps draft 100 with persisted [] and sent [], then -1 yields
      draft 99, persisted [99], and sent []. Existing 5/20, Save, Activity/process
      recreation, retry, pending, and repository siblings remain and the targeted
      independent rerun passed 38/38 with zero failures, errors, or skips.

implementation_transition_matrix:
  authoritative_writer: "Mobile remains the sole effective-settings writer."
  wear_persistence_boundary: >-
    Every accepted InlineSlider decrease/increase value calls the existing
    WearThresholdSettingsController.updateDraft repository transaction only.
  rows:
    - input: "InlineSlider decrease while draft is above 5"
      result: "Persist draft minus one percent; send no MessageClient request."
    - input: "InlineSlider increase while draft is below 100"
      result: "Persist draft plus one percent; send no MessageClient request."
    - input: "Decrease/increase at the 5/100 boundary"
      result: "Keep the current in-range draft; send no request."
    - input: "Crown rotation while the threshold editor is visible"
      result: >-
        Do not consume the rotary event in the threshold editor; leave it to
        ordinary ScalingLazyColumn screen scrolling and keep the draft unchanged.
    - input: "Explicit Save"
      result: >-
        Preserve the existing BN-002 prepare/send/result state machine and send
        only the final persisted draft.
    - input: "Passive recreation with an unsaved editing draft and no Save intent"
      result: >-
        Re-enqueue only the restored draft for Wear Proto persistence; send no
        MessageClient request and create no pending request or retry.
    - input: "Recreation with an explicit Save intent or durable pending request"
      result: >-
        An explicit Save intent uses the existing atomic replay guard. If a durable
        request/status already exists, the draft transaction is a no-op; preserve
        pending/status and explicit-retry-only behavior with no additional send.
    - input: "Disconnect, reconnect, process recreation, retry, or cancel"
      result: >-
        Preserve existing ADR-015 behavior; this UI change introduces no new
        callback ordering, pending field, automatic send, or auto-apply path.
  unsupported_combinations: []

