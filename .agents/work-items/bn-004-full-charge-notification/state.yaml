    unblock_requirement: >-
      Start and pair a compatible Mobile/Wear emulator pair or connect a paired
      test device set, then identify both builds and rerun TC-E085 first.
  - id: "BLK-009"
    owner: "test"
    status: "active"
    summary: >-
      Pixel 10 Pro Fold and Pixel Watch 4 are now connected and the specific
      Wear-button regression passed, but the remaining mandatory real-device
      scenarios, battery impact, and notification latency are not completed.
    unblock_requirement: >-
      Execute the remaining TC-E085..089 scenarios and record battery/latency
      observations without device identifiers.

risks:
  - id: "RSK-011"
    severity: "high"
    summary: >-
      Battery level may oscillate between 99 and 100 while still plugged in;
      session-scoped arming must prevent repeated full-charge notifications.
  - id: "RSK-012"
    severity: "medium"
    summary: >-
      A Wear setting request can be applied on Mobile while its result is lost;
      request/result state must be persisted and explicitly retryable.
  - id: "RSK-013"
    severity: "medium"
    summary: >-
      Older app versions do not understand the new setting or event; optional
      phone-state data and a separate fixed event path must remain compatible.

