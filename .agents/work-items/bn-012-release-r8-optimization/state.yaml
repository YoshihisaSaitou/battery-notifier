      Wear mapping/AAB SHA-256: 0705CE2DD1C7B226DCF1D5AB8EE3C25BD116028BC4CB0373E36555EDD1D3C1C1 /
      15A495773E3CBF7DC7D4165D0D831012731B0F50C486596D701635165149C308.
  - id: "TC-E105"
    result: "blocked"
    summary: >-
      Optimized-release real-device smoke testing is Human-owned. The current local
      AABs are unsigned and Mobile/Wear both have working-tree versionCode 1; Human
      must create approved distinct-version, same-signing candidates before execution.
  - id: "TC-E104"
    command: >-
      Mobile then Wear: .\gradlew.bat test lint assembleRelease bundleRelease;
      inspect mapping.txt, AAB proguard.map/r8.json, hashes, and signature entries
    result: "pass"
    summary: >-
      Test rerun passed in 27s Mobile and 15s Wear. Mobile Debug/Release JVM 121/121
      each and Wear 96/96 each remain Pass; lint has 0 Fatal/Errors. Embedded mapping
      SHA-256 equals local mapping for both AABs. Signature entry count is 0 for both.

