review_findings:
  - id: "RV-013-001"
    severity: "Medium"
    status: "verified_fixed"
    location: "BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/batterynotifierandroidmobileapp/presentation/ThresholdEditor.kt:52"
    requirement_refs:
      - "PR-001"
      - "AC-026"
      - "TC-E094"
    scenario: >-
      Removing steps=94 leaves the Compose Slider at its default steps=0.
      onValueChange roundToInt keeps the displayed draft integral but does not
      expose 96 discrete values or one-percent steps through Slider semantics.
    required_outcome: >-
      Restore steps=94 or equivalent discrete accessibility semantics without
      restoring numeric labels, and verify TalkBack/semantics one-percent actions.
  - id: "RV-013-002"
    severity: "Medium"
    status: "verified_fixed"
    location: "BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/batterynotifierandroidmobileapp/MainActivity.kt:116"
    requirement_refs:
      - "M-004"
      - "AC-026"
    scenario: >-
      With saved threshold 20, pressing increase produces an unsaved draft 21
      and resets saveState to IDLE, whose English/Japanese message claims the
      displayed threshold is saved although persistence remains 20.
    required_outcome: >-
      Add an explicit unsaved-draft state and localized text, then verify the
      actual 20 -> 21 -> Save transition and persistence/sync call boundary.
  - id: "RV-014-001"
    severity: "Low"
    status: "accepted_risk_by_human_final_approval"
    location: "BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/batterynotifierandroidmobileapp/MainActivity.kt:92"
    requirement_refs:
      - "M-004"
      - "AC-026"
    scenario: >-
      Start with saved=20 and draft=21/UNSAVED, then let a sibling writer path
      update settings.thresholdPercent to 21 or 25. rememberSaveable reinitializes
      the draft for the new saved key, but saveState is not derived again, so the
      Save button can be disabled while the stale UNSAVED message remains visible.
    required_outcome: >-
      Reconcile saveState whenever the persisted threshold changes and add a
      regression fixture covering an external saved-value update during an
      unsaved Mobile draft. No incorrect persistence was observed.
implementation_impact_analysis:
  authoritative_writer: >-
    ThresholdSettingsController remains the only writer for the Mobile
    threshold; editor changes update an in-memory draft only, and explicit Save
    invokes repository persistence before sync coordination.
  transition_matrix:
    - state: "saved=20, draft=20, IDLE"
      action: "increase or slider edit to 21"
      result: "saved=20, draft=21, UNSAVED; no persistence or sync call"
    - state: "saved=20, draft=21, UNSAVED"
      action: "edit back to 20"
      result: "saved=20, draft=20, IDLE; no persistence or sync call"
    - state: "saved=20, draft=21, UNSAVED"
      action: "explicit Save"
      result: >-
        SAVING, then the existing controller persists 21 and coordinates sync;
        completion maps to SAVED, SAVED_SYNC_PENDING, SAVED_SYNC_FAILED, or
        INVALID_THRESHOLD.
    - state: "draft at 5 or 100"
      action: "slider semantics or side-button adjustment"
      result: >-
        one-percent discrete values remain clamped to 5..100; persistence and
        sync remain absent until explicit Save.
  sibling_paths_inspected:
    - "MainActivity editor callback and explicit Save callback"
    - "ThresholdSettingsController repository-first save and sync result mapping"
    - "ThresholdEditor slider, decrease button, and increase button paths"
    - "English and Japanese threshold status resources"
