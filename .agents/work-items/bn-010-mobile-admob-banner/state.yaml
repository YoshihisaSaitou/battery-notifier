loop_control:
  same_cause_failure_limit: 3
  phase_return_limit: 5
  current_failure_signature: null
  consecutive_same_cause_failures: 0
  total_phase_returns: 2
  attempts:
    - attempt: 1
      cause_id: "BN010-KOTLIN-METADATA"
      check: >-
        .\gradlew.bat testDebugUnitTest --tests *MobileAdsGateTest --tests
        *AdMobConfigurationContractTest
      failure_signature: "Kotlin metadata 2.3.0, expected 2.0.0"
      root_cause_hypothesis: >-
        Google Mobile Ads 25.4.0 is compiled for Kotlin 2.3 while the Mobile
        project still used Kotlin 2.0.21.
      corrective_change: >-
        Upgrade the independent Mobile project Kotlin and Compose compiler
        plugins to official Kotlin 2.3.20, which supports the dependency's
        metadata and the existing Gradle generation.
      result: "fail"
      result_detail: >-
        Ads metadata compiled successfully, but Kotlin 2.3.20 stopped the build
        because the project still used the removed kotlinOptions.jvmTarget
        String DSL. No source compilation or test execution occurred.
    - attempt: 1
      cause_id: "BN010-ADLISTENER-NULLABILITY"
      check: >-
        .\gradlew.bat testDebugUnitTest --tests *MobileAdsGateTest --tests
        *AdMobConfigurationContractTest
      failure_signature: "Null cannot be a value of a non-null type AdListener"
      root_cause_hypothesis: >-
        Current SDK annotations expose AdView.adListener as non-null to Kotlin.
      corrective_change: >-
        Stop assigning null during disposal; destroy the detached AdView, which
        is the required lifecycle boundary and releases its listener with it.
      result: "pass"
      result_detail: >-
        The rerun no longer reported the non-null AdListener assignment error.
    - attempt: 2
      cause_id: "BN010-KOTLIN-METADATA"
      check: >-
        .\gradlew.bat testDebugUnitTest --tests *MobileAdsGateTest --tests
