review_findings:
  - id: "RV-BN010-001"
    severity: "medium"
    status: "verified_fixed"
    file: >-
      BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/
      batterynotifierandroidmobileapp/presentation/AdMobBanner.kt:29
    requirement: "FR-077, AC-031, RISK-BN010-002"
    scenario: >-
      MainActivity enables edge-to-edge and supplies AdMobBanner as a custom
      Scaffold bottomBar. Material Scaffold expects a present bottomBar to
      handle its own insets, but AdMobBanner only fills width and does not apply
      navigationBarsPadding or safeDrawing bottom inset. On three-button or
      gesture navigation configurations, the banner can extend into system
      navigation/gesture space.
    required_outcome: >-
      Apply the relevant bottom system-navigation inset to the custom banner
      container without adding pre-load empty space, and add an automated source
      or Compose contract that fails if the inset handling is removed.
    evidence: >-
      Code inspection plus Android Material3 Scaffold API documentation reviewed
      2026-08-12: contentWindowInsets do not handle bottom insets when bottomBar
      is present because the bottomBar is expected to do so.
    implementation_fix: >-
      AdMobBanner applies navigationBarsPadding to AndroidView inside the
      isLoaded branch. No padding is applied to the unloaded BoxWithConstraints,
      so FR-078's no-preload-space rule remains intact.
    implementation_evidence: >-
      AdMobConfigurationContractTest 4/4; lintDebug XML 0 errors/25 warnings;
      compileDebugAndroidTestKotlin and assembleDebug Gradle success; search
      found MainActivity as the only custom bottomBar and AdMobBanner as its
      inset-owning child; git diff --check passed.
    review_verification: >-
      Review confirmed the inset is inside the isLoaded AndroidView modifier,
      the unloaded container remains zero-height, MainActivity has the only
      custom bottomBar, and the regression source contract passes 4/4.

risks:
  - id: "RISK-BN010-001"
    severity: "high"
    status: "open"
    description: >-
      A production ad request before required consent or with incomplete AdMob
      console messaging could violate privacy or advertising policy.
    mitigation: >-
      Gate SDK initialization and banner requests on UMP canRequestAds, expose
      privacy options when required, use demo IDs in debug, and keep production
      release approval with the human.
  - id: "RISK-BN010-002"
    severity: "medium"
    status: "open"
    description: >-
      A fixed banner could obscure scroll content or system navigation on fold,
      split-screen, maximum-font, or edge-to-edge layouts.
    mitigation: >-
      Place the banner in Scaffold bottomBar using current-width anchored
      adaptive sizing and verify content remains scrollable above it.
  - id: "RISK-BN010-003"
    severity: "medium"
    status: "open"
    description: >-
      Loading or clicking production ads during development can create invalid
      traffic and place the AdMob account at risk.
    mitigation: >-
      Compile Google demo application and banner IDs into debug builds and the
      supplied production IDs into release builds only.

