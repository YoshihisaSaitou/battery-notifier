    violated_requirement: "data-design.md:65 and data-design.md:203"
    scenario: >-
      The result contract requires phoneStateSequence to be 1 or greater, but
      both domain models, both persisted-state sanitizers, and the Wear result
      validator accept 0. Mobile also keeps sequence 0 when it processes an
      otherwise valid request before any battery snapshot exists, applies the
      setting, creates no state outbox, and emits an APPLIED result with
      sequence 0. Wear accepts it but has no corresponding phone-state through
      which APPLIED_WAITING_STATE can converge.
    required_outcome: >-
      Ensure Mobile associates every result with a positive, publishable
      phone-state sequence, including the no-snapshot lifecycle boundary, or
      safely rejects/defers the request without applying it. Reject result
      sequences less than 1 at Mobile/Wear domain and persistence boundaries
      and at Wear message validation. Add no-snapshot plus zero/negative
      rejection regressions proving no applied-but-unconfirmable state.
    verification_evidence:
      - >-
        Static contract comparison found every implementation predicate uses
        non-negative rather than positive while the two normative data-design
        tables require 1 or greater. Existing validator tests do not exercise
        zero or negative phoneStateSequence values.
      - >-
        MobileStateRepository computes nextSequence only when lastSnapshot is
        non-null, so a default sequence-0 state can apply a threshold change
        and persist/reply with result sequence 0 without creating a state
        outbox.
      - >-
        IMP-016 defers Mobile processing without mutation or result until a
        phone snapshot is available, attempts one serialized battery refresh,
