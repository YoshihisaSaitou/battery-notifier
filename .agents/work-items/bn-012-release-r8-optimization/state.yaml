      lint reported 0 Fatal, 0 Error, 31 warnings; optimized APK/AAB were produced.
  - id: "CHK-012-AAB-METADATA"
    command: "jar tf each release AAB and inspect mapping/mapping hashes"
    result: "pass"
    summary: >-
      Both mappings are non-empty and both AABs contain proguard.map and r8.json.
      Mobile mapping/AAB SHA-256: D992D1F8A98437ED739FE3874AB98D374F3509D467D690330E1B317E9047601E /
