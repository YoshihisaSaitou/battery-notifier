work_item:
  id: "BN-004"
  slug: "bn-004-full-charge-notification"
  title: "Full-charge notification and cross-device setting"
  scope: >-
    Notify once on Mobile and Wear when the monitored phone reaches 100 percent
    during a charging session, and let the user enable or disable this behavior
    from either app while Mobile remains the only authoritative settings writer.

