      re-review on 2026-08-08. Production and specification scope remain frozen.

risks:
  - id: "RSK-008"
    severity: "medium"
    summary: >-
      A request can be applied on Mobile while its result message is lost.
      Persisting and replaying the result for the same requestId is required to
      avoid duplicate semantic application and ambiguous retry behavior.
  - id: "RSK-009"
    severity: "medium"
    summary: >-
      A stale Wear screen can overwrite a newer Mobile setting unless the
      request includes expectedThresholdPercent and Mobile rejects conflicts.
  - id: "RSK-010"
    severity: "low"
    summary: >-
      41mm/45mm and large-font layouts need a scrollable, accessible editor
      with one-percent controls and an explicit save action.

review_findings:
  - id: "RV-001"
    severity: "High"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/data/datastore/WearStateRepository.kt:396
    related_locations:
      - "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:436"
    violated_requirement: "FR-009, TC-E082"
    scenario: >-
      prepareThresholdChange persists SENDING before MessageClient starts. If
      the Wear process ends after that write but before
      markThresholdChangeSendResult, restart restores SENDING. The UI provides
      neither retry nor cancel for SENDING, so the request is permanently
      stranded.
    required_outcome: >-
      On process recreation, recover an interrupted SENDING request into a
      retryable/cancellable state without automatic transmission. Add a test
      that recreates the repository immediately after preparation and proves
      explicit retry uses the same requestId.
    verification_evidence:
      - >-
        ProtoWearStateRepositoryTest and
        WearThresholdSettingsControllerTest recover persisted SENDING to
        SEND_FAILED and explicitly retry the same requestId without auto-send.
  - id: "RV-002"
    severity: "High"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:380
    related_locations:
      - "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/data/datastore/WearStateRepository.kt:435"
    violated_requirement: "AC-016 and wear-os-integration-specification.md:171"
    scenario: >-
      Wear last received threshold 20, Mobile changes to 25, and a stale Wear
      request receives CONFLICT with effectiveThresholdPercent 25 before the
      new phone-state arrives. The repository stores 25 only as the draft, but
      the non-editing UI renders displayState.thresholdPercent from the old
      phone-state and continues to show 20.
    required_outcome: >-
      Display the result's effective Mobile threshold alongside the conflict
      state immediately, without falsely advancing the phone-state sequence,
      and keep it until an equal-or-newer phone-state confirms or supersedes
      it. Add presentation/state tests for the 20 -> conflict(25) ordering.
    verification_evidence:
      - >-
        Conflict/rejected results retain the confirmed effective threshold
        until an equal-or-newer phone-state arrives; WearDisplayStateMapperTest
        covers old phone-state 20 with conflict effective value 25.
      - >-
        Independent re-review found the reverse callback order remains broken:
        when phone-state sequence 12 with threshold 30 is stored before a
        delayed CONFLICT result for sequence 11 with effective threshold 25,
        the result is stored without reconciling the existing newer
        phone-state and the display regresses to 25.
      - >-
        IMP-015 reconciles CONFLICT/REJECTED results against the already
        persisted lastPhoneState before retaining a result override.
        ProtoWearStateRepositoryTest covers result-first and phone-state-first
        orders for both result codes.
      - >-
        Final independent re-review traced both callback orders through
        applyThresholdChangeResult and applyPhoneState and reran the focused
        Wear suite with 39/39 passing tests.
  - id: "RV-003"
    severity: "High"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/data/datastore/WearStateRepository.kt:149
    related_locations:
      - "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:161"
    violated_requirement: "FR-007 and wear-os-display-specification.md:90"
    scenario: >-
      After a completed Wear change leaves draft 30, Mobile later changes the
      effective threshold to 25 and sends a newer phone-state. applyPhoneState
      updates lastPhoneState but leaves the terminal draft at 30. Opening the
      editor uses that old draft; saving without an intentional edit changes
      Mobile back to 30 because expectedThresholdPercent correctly uses 25.
    required_outcome: >-
      Rebase the next editor draft from each newer confirmed phone-state when
      no request or active edit is pending, while preserving a genuinely
      active draft. Add regression coverage for a Mobile-side change after an
      APPLIED/CONFLICT/REJECTED terminal state.
    verification_evidence:
      - >-
        Terminal and cancelled flows clear the inactive draft while an actual
        edited draft remains persisted. ProtoWearStateRepositoryTest proves a
        later Mobile value 25 seeds the next request instead of stale 30.
  - id: "RV-004"
    severity: "High"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/batterynotifierandroidmobileapp/data/wearable/ThresholdChangeMessageCodec.kt:21
    related_locations:
      - "BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/batterynotifierandroidmobileapp/data/wearable/MobileDataLayerListenerService.kt:49"
      - "BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/batterynotifierandroidmobileapp/data/datastore/MobileStateRepository.kt:285"
    violated_requirement: "FR-065, FR-066, data-design.md:207"
    scenario: >-
      A structurally typed request with schemaVersion 0 or a negative value is
      classified as UnsupportedSchema. The listener forwards that value to
      recordUnsupportedSchema, whose positive-value require throws from an
      uncaught launch coroutine instead of safely rejecting the payload.
    required_outcome: >-
      Treat non-positive schema versions as malformed or record them without
      throwing. Preserve the last valid state and increment exactly one
      diagnostic counter. Add validator/listener-boundary regression tests for
      zero and negative schema versions.
    verification_evidence:
      - >-
        ThresholdChangeRequestValidatorTest classifies schema 0 and -1 as
        malformed; Mobile recordUnsupportedSchema is also defensive and no
        longer throws for non-positive external input.
  - id: "RV-005"
    severity: "Medium"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/data/datastore/WearStateRepository.kt:384
    related_locations:
      - "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/application/settings/WearThresholdSettingsController.kt:43"
    violated_requirement: "FR-009 one-pending-request rule"
    scenario: >-
      Two save callbacks reaching prepareThresholdChange concurrently each
      create a new requestId; the later DataStore update replaces the first
      pending request while the first message can still be sent. UI
      recomposition is not an atomic concurrency boundary.
    required_outcome: >-
      Atomically refuse creation of a second request while any request is
      pending, keep the original requestId, and prevent a second send. Add a
      concurrent-save test that asserts one prepared and one sent request.
    verification_evidence:
      - >-
        Repository preparation now atomically returns ALREADY_PENDING.
        Concurrent repository/controller tests prove one preparation, one
        send, and preservation of the first requestId.
  - id: "RV-006"
    severity: "Medium"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/batterynotifierandroidmobileapp/application/sync/MobileSyncCoordinator.kt:136
    violated_requirement: "AC-015 convergence and RSK-008 recovery"
    scenario: >-
      Mobile can apply and persist a request, fail the phone-state DataItem
      write, then successfully send the APPLIED result. Wear waits in
      APPLIED_WAITING_STATE. An explicit retry is replayed with
      settingChanged=false, so the coordinator skips syncPending and only
      resends the result; without another runtime trigger, the phone-state
      never converges.
    required_outcome: >-
      A replay of an applied result with a still-pending state outbox must
      retry state delivery without allocating another sequence or event.
      Cover state-send failure plus result success plus same-request retry.
    verification_evidence:
      - >-
        MobileSyncCoordinatorTest proves replayed APPLIED with pending state
        outbox calls syncPending while sequence and pending sequence remain 12.
  - id: "RV-007"
    severity: "Medium"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidWearApp/app/src/test/java/com/magicitengineer/batterynotifierandroidwearapp/data/datastore/ProtoWearStateRepositoryTest.kt:298
    related_locations:
      - "BatteryNotifierAndroidMobileApp/app/src/test/java/com/magicitengineer/batterynotifierandroidmobileapp/data/wearable/ThresholdChangeRequestValidatorTest.kt:55"
      - "BatteryNotifierAndroidMobileApp/app/src/test/java/com/magicitengineer/batterynotifierandroidmobileapp/application/sync/MobileSyncCoordinatorTest.kt:432"
    violated_requirement: "Review-fix regression evidence for RV-003, RV-004, and RV-006"
    scenario: >-
      Current regressions cover only APPLIED draft rebasing, validator-level
      non-positive schema rejection, and a preconstructed pending replay.
      They do not prove CONFLICT/REJECTED terminal rebasing plus active-draft
      preservation, listener-boundary exactly-one diagnostics without a
      crash, or the complete state-send-failure/result-success/same-request
      retry chain with no new event.
    required_outcome: >-
      Add focused regressions for every terminal result and active-draft
      preservation, the listener boundary for schema zero and negative values,
      and the complete Mobile delivery/replay chain including unchanged
      sequence and no new event.
    verification_evidence:
      - >-
        Independent inspection of the three focused test classes found the
        production fixes plausible but the stated edge cases unasserted.
      - >-
        IMP-015 adds CONFLICT/REJECTED terminal rebasing and active-draft
        preservation tests, listener-boundary exactly-one invalid diagnostics
        for schema 0/-1, and an actual repository/coordinator/handler chain for
        state failure, result success, same-request retry, unchanged sequence,
        and no event.
      - >-
        Final independent re-review confirmed the requested assertions and
        reran the focused Mobile 23/23 and Wear 39/39 suites successfully.
  - id: "RV-008"
    severity: "Medium"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/application/settings/WearThresholdSettingsController.kt:58
    related_locations:
      - "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:192"
      - "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt:446"
    violated_requirement: "FR-009 one-pending-request rule and deterministic retry state"
    scenario: >-
      Two rapid retry actions can both read the same SEND_FAILED or
      WAITING_RESULT request and call the gateway because retry does not
      atomically reserve SENDING and the UI remains enabled. Reverse completion
      order can then leave a misleading local status even though Mobile
      idempotency prevents a duplicate setting mutation.
    required_outcome: >-
      Atomically reserve a pending request for retry by moving it to SENDING,
      refuse a competing retry, and add a delayed/concurrent gateway test that
      proves only one retry transmission and deterministic completion state.
      Retrying from APPLIED_WAITING_STATE must also retain enough result state
      to reconcile an arriving confirming phone-state while the gateway is in
      flight, so result-message loss cannot leave a confirmed change waiting.
    verification_evidence:
      - >-
        Independent code inspection found no in-flight guard in the controller
        or retry/cancel UI while the persisted status remains retryable.
      - >-
        IMP-015 adds a DataStore-atomic retry reservation that changes the
        pending request to SENDING before gateway invocation, refuses a second
        reservation, protects completion from overwriting a result callback,
        and verifies one gateway call with a delayed concurrent test.
      - >-
        Final independent re-review verified the atomic reservation itself but
        found a remaining ordering defect: retrying APPLIED_WAITING_STATE moves
        to SENDING; a confirming phone-state arriving before gateway completion
        then clears the stored result because reconciliation only recognizes
        APPLIED_WAITING_STATE. If the replayed result is lost, send completion
        leaves WAITING_RESULT even though confirmation already arrived. The
        current concurrent retry regression starts only from SEND_FAILED.
      - >-
        IMP-016 makes APPLIED-result reconciliation independent of the
        transient SENDING status, preserves APPLIED_WAITING_STATE on send
        completion or process recovery while an APPLIED result is stored, and
        adds a controller regression where confirming phone-state arrives
        before delayed gateway completion. Independent verification remains
        required.
      - >-
        Independent re-review traced both gateway/result/phone-state callback
        orders and process recovery. The stored APPLIED result survives SENDING,
        reconciliation is result-code based, and the reviewer-selected Wear
        repository/controller suite passed 28/28 within the 35-test targeted
        group.
