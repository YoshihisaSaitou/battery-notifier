        status: "reviewed_passed_with_runtime_identity_gate_remaining"
      - id: "REV-005"
        title: "Android service, receiver, coroutine, and UI lifecycle behavior"
        status: "changes_requested_rv002"
    findings:
      - id: "RV-001"
        severity: "High"
        status: "fixed"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/data/wearable/WearDataLayerListenerService.kt"
        location: "onDataChanged lines 38-45"
        requirement_refs: ["FR-041", "FR-044", "FR-045", "AC-013"]
        scenario: >-
          Persist a threshold event as PENDING and suspend its notification post;
          apply a phone-state update before the first post completes.
        observed: >-
          Every APPLIED DataItem, including phone-state, invokes deliver with the
          same PENDING event. Parallel state callbacks can call the gateway more
          than once while attempt count remains one and can bypass the three-post cap.
        required_outcome: >-
          Only the atomic threshold-event reservation may own initial delivery,
          or delivery must acquire an equivalent one-use token. Add an event/state
          interleaving test proving one gateway call and exact attempt accounting.
        verification: >-
          Initial delivery is now owned only by the threshold-event path. The
          event/phone-state interleaving regression proves one gateway call and
          an unchanged single-attempt count. Targeted debug tests pass.
      - id: "RV-002"
        severity: "High"
        status: "open"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/application/notification/DeliverPendingWearNotification.kt"
        location: "deliver and retry; MainActivity.onStart; listener service cancellation"
        requirement_refs: ["FR-040", "FR-044", "NBR-001", "REV-005"]
        scenario: >-
          Stop the Wear service or process after PENDING is persisted but before
          gateway completion, including CancellationException.
        observed: >-
          PENDING remains indefinitely. Duplicate DataItems are ignored and
          foreground retry accepts only RESERVED_FAILED, so the notification is
          lost; a later phone-state can also revive it through RV-001 without expiry recheck.
        required_outcome: >-
          Implement bounded in-flight recovery that cannot lose, duplicate,
          resurrect an expired event, or exceed the attempt cap, and add process-
          interruption regression coverage.
        verification: >-
          Re-review failed. The gateway-thrown CancellationException path is
          protected, but cancellation after gateway return and before the
          suspending completion write is outside the NonCancellable block. If
          recoverInterruptedNotificationOnce already completed earlier in the
          process, the resulting PENDING state is not recovered on foreground
          because retry accepts RESERVED_FAILED only. Existing tests cover
          gateway-thrown cancellation, not service cancellation at this boundary.
      - id: "RV-003"
        severity: "High"
        status: "fixed"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/data/datastore/WearStateRepository.kt"
        location: "reserveNotificationRetry lines 209-247"
        requirement_refs: ["AC-007", "NBR-001", "REV-001"]
        scenario: >-
          After an initial post failure, roll the Wear wall clock back more than
          the five-minute skew tolerance and foreground the app.
        observed: >-
          Retry checks only now <= expiresAt, so an event whose occurredAt is far
          in the apparent future is reserved and posted.
        required_outcome: >-
          Re-evaluate clock rollback/skew before retry, make the result terminal
          without calling the gateway, and cover equality and rollback boundaries.
        verification: >-
          Retry now applies the five-minute future-skew boundary before any
          reservation, persists CLOCK_SKEW terminally, and never calls the
          gateway. Equality and one-millisecond-beyond tests pass.
      - id: "RV-004"
        severity: "High"
        status: "fixed_runtime_test_required"
        file: "BatteryNotifierAndroidWearApp/app/src/main/AndroidManifest.xml"
        location: "complication UPDATE_PERIOD_SECONDS and MainTileService/MainComplicationService"
        requirement_refs: ["FR-031", "FR-051", "AC-005", "CPS-001"]
        scenario: >-
          Receive a Fresh state, disconnect, and leave the Tile or complication
          active with no later DataItem.
        observed: >-
          Both surfaces return static content; update period is zero and refresh
          requests occur only on DataItems. No code schedules the two/five-minute
          boundaries, so cached Fresh content can remain after five minutes.
        required_outcome: >-
          Use a bounded system-supported validity/timeline or refresh mechanism
          that guarantees Delayed/Stale transitions without new DataItems, with
          disconnected boundary tests for Tile and complication.
        verification: >-
          Tile and complication now use shared epoch validity timelines covering
          Fresh, Delayed, and Stale boundaries without another DataItem. Boundary
          unit evidence passes; actual system-surface behavior remains not_run.
      - id: "RV-005"
        severity: "High"
        status: "fixed"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt"
        location: "nowEpochMillis ticker lines 85-99 and WearDisplayStateMapper"
        requirement_refs: ["FR-031", "AC-004", "REV-001"]
        scenario: >-
          Receive a new phone state between the activity's one-minute clock ticks.
        observed: >-
          The saved receivedAt can be later than the stale UI now value; the new
          valid state maps to STALE for up to about 60 seconds instead of Fresh.
        required_outcome: >-
          Advance display time on each received-state change while preserving
          explicit rollback detection, and add a between-ticks regression test.
        verification: >-
          MainActivity refreshes now when receivedAt changes, so a newly applied
          state no longer waits for the minute ticker. Negative-age mapping also
          exposes the clock warning. Unit boundary evidence passes.
      - id: "RV-006"
        severity: "High"
        status: "fixed_runtime_test_required"
        file: "BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/batterynotifierandroidmobileapp/application/sync/MobileSyncCoordinator.kt"
        location: "startMonitoring lines 118-125; MobileStateRepository.updateMonitoringState"
        requirement_refs: ["FR-013", "NBS-001", "REV-005"]
        scenario: >-
          Stop monitoring with the persisted level 21 and armed=true, let the
          real battery fall to 20 while stopped, then start monitoring at threshold 20.
        observed: >-
          Start retains the stale previous level and armed state; the sticky
          callback is evaluated as a normal 21-to-20 crossing and posts an
          immediate alert although first-low-on-start is disabled.
        required_outcome: >-
          Atomically establish a start baseline before callback evaluation and
          distinguish user start from recovery. Add stop-discharge-start tests.
        verification: >-
          User start captures or resets a baseline before enabling monitoring;
          recovery remains a separate path. Stop-discharge-start repository and
          coordinator tests pass; sticky Receiver/FGS runtime remains not_run.
      - id: "RV-007"
        severity: "High"
        status: "fixed"
        file: "docs/functional-requirements.md"
        location: "FR-002/FR-012 and Mobile AlertRule/ThresholdEvaluator/UI"
        requirement_refs: ["PR-001", "PR-002", "FR-002", "FR-012"]
        scenario: "Set threshold to the allowed value 100 and discharge from 100 to 99."
        observed: >-
          The value domain is 0..100 but the crossing condition requires
          previousLevel > 100, which is impossible; the allowed setting can
          never generate an event.
        required_outcome: >-
          Specification must define the 100-percent boundary or reduce the
          maximum. Then align UI, domain, payload validation, docs, and tests.
        verification: >-
          SPEC-006 defines initial 100 as armed without notification, 100-to-99
          as the crossing, first observation below 100 as disarmed, and 100 as
          the re-arm value in FR-012/015/019, AC-014, and TC-U023/U024.
      - id: "RV-008"
        severity: "High"
        status: "fixed_runtime_test_required"
        file: "BatteryNotifierAndroidMobileApp/app/src/main/AndroidManifest.xml"
        location: "MobileDataLayerListenerService MESSAGE_RECEIVED-only filter"
        requirement_refs: ["FR-064", "AC-006", "WIS-001", "REV-003"]
        scenario: >-
          Change phone state while disconnected, reconnect without sending the
          Wear request-state message, and wait for automatic convergence.
        observed: >-
          The only automatic entry is onPeerConnected, but the manifest registers
          only the exact MESSAGE_RECEIVED path and no capability-change listener.
          Current Google guidance requires declaring interested event actions and
          recommends CapabilityClient for app-specific network availability; no
          paired runtime evidence proves this callback is awakened on reconnection.
        required_outcome: >-
          Explicitly subscribe to a current capability/node reachability signal
          and prove reconnect causes recapture, new sequence, and urgent send
          without a request-state message.
        verification: >-
          Wear declares the receiver capability and Mobile subscribes to the
          exact CAPABILITY_CHANGED path, routing reachable changes to current
          recapture and urgent convergence. Unit routing passes; paired runtime
          reconnection without request-state remains not_run.
      - id: "RV-009"
        severity: "Medium"
        status: "fixed_runtime_test_required"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/presentation/MainActivity.kt"
        location: "onStart lines 155-162"
        requirement_refs: ["FR-044", "REV-005"]
        scenario: >-
          Recreate the Activity for locale, font, or configuration changes while
          the app remains foreground and an event is RESERVED_FAILED.
        observed: "Each recreation consumes another automatic retry and can exhaust the event."
        required_outcome: >-
          Bind automatic retry to a real process/app background-to-foreground
          transition or guard recreation, with lifecycle regression coverage.
        verification: >-
          Automatic retry moved from Activity.onStart to ProcessLifecycleOwner
          onStart, preventing ordinary Activity recreation from consuming a
          retry. Configuration-change runtime evidence remains not_run.
      - id: "RV-010"
        severity: "Medium"
        status: "fixed_runtime_test_required"
        file: "BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/batterynotifierandroidmobileapp/MainActivity.kt"
        location: "refreshNotificationPermissionState; Wear MainActivity equivalent"
        requirement_refs: ["DEC-004", "TC-E064"]
        scenario: >-
          Grant POST_NOTIFICATIONS and global app notifications, disable only the
          battery_alerts channel, then reopen either app.
        observed: >-
          Both UIs report notifications enabled because they omit channel
          importance, while their gateways correctly reject channel-disabled posts.
        required_outcome: >-
          Include channel state in the UI model and show the notification settings
          route immediately; add channel-none tests for Mobile and Wear.
        verification: >-
          Both apps combine runtime permission, app notification state, and
          battery_alerts channel importance and provide the channel settings
          route. Unit evidence passes; real channel-disabled UX remains not_run.
      - id: "RV-011"
        severity: "Medium"
        status: "fixed"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/platform/presentation/AndroidWearSurfaceUpdater.kt"
        location: "requestRefresh lines 20-23"
        requirement_refs: ["CPS-001", "WIS-001", "REV-002"]
        scenario: "Apply 30 phone-state DataItems in a short burst."
        observed: >-
          Every applied item immediately requests Tile and all complication
          updates; there is no coalescing window.
        required_outcome: "Coalesce burst refresh requests to a bounded rate and add a burst test."
        verification: >-
          A process-wide atomic coalescer limits Tile/complication refresh to
          one request per 250 ms window; burst unit evidence passes.
      - id: "RV-012"
        severity: "Medium"
        status: "fixed_runtime_test_required"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/complication/MainComplicationService.kt"
        location: "createComplicationData/buildDescription lines 49-90"
        requirement_refs: ["FR-051", "CPS-001"]
        scenario: "Request complication data for Charging and Delayed states."
        observed: >-
          Charging and Delayed are present only in content description or are
          rendered as ordinary discharging; no visible icon/warning is returned.
        required_outcome: >-
          Make supported complication types visibly distinguish charging and
          delayed status and assert the returned ComplicationData.
        verification: >-
          SHORT_TEXT and RANGED_VALUE data now include distinct visible status
          titles for Charging and Delayed, asserted by complication-data tests.
          Representative watch-face rendering remains not_run.
      - id: "RV-013"
        severity: "Medium"
        status: "fixed"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/domain/presentation/WearDisplayState.kt"
        location: "negative age mapping lines 52-68 and MainActivity stale age rendering"
        requirement_refs: ["REV-001", "TC-E034"]
        scenario: "Roll the Wear wall clock behind phoneStateReceivedAt and open the app."
        observed: >-
          State becomes STALE but clockWarning remains false and the UI renders
          the null age as zero minutes ago.
        required_outcome: "Expose an explicit rollback warning and avoid a misleading relative age; add tests."
        verification: >-
          Negative age maps to Stale with null relative age and an explicit
          clock warning; the app does not render a misleading zero-minute age.
      - id: "RV-014"
        severity: "Medium"
        status: "fixed_runtime_test_required"
        file: "BatteryNotifierAndroidMobileApp/app/src/main/AndroidManifest.xml"
        location: "allowBackup=true and empty backup/data-extraction rules; Wear manifest equivalent"
        requirement_refs: ["DDS-001"]
        scenario: "Run Android cloud backup with the default empty exclusion rules."
        observed: >-
          Proto DataStore state, event IDs, and pending outboxes are eligible for
          cloud backup although DDS-001 states data is not stored on external servers.
        required_outcome: >-
          Exclude Proto DataStore from cloud backup on both apps, explicitly decide
          D2D transfer, and define safe handling of restored pending event/outbox state.
        verification: >-
          ADR-014 and PPS-001 exclude both complete Proto files from cloud
          backup and device transfer; TC-U025 defines the static contract gate.
      - id: "RV-015"
        severity: "Low"
        status: "fixed"
        file: "BatteryNotifierAndroidWearApp/app/src/main/AndroidManifest.xml"
        location: "com.google.android.wearable.standalone=true lines 67-69"
        requirement_refs: ["PR-003", "PR-004"]
        scenario: "Publish the Wear artifact to Google Play with current metadata."
        observed: >-
          The app declares standalone although phone battery data is a core
          dependency. Current Android guidance requires false for this case.
        required_outcome: "Set standalone=false and verify paired-app distribution behavior."
        verification: "Wear manifest declares com.google.android.wearable.standalone=false."
      - id: "RV-016"
        severity: "Low"
        status: "fixed"
        file: "BatteryNotifierAndroidWearApp/app/src/test/java/com/magicitengineer/batterynotifierandroidwearapp/data/datastore/ProtoWearStateRepositoryTest.kt"
        location: "retry migration coverage"
        requirement_refs: ["IMP-005", "TC-U019", "TC-U022"]
        scenario: >-
          Read a pre-counter proto whose disposition is PENDING, POSTED,
          PERMISSION_DENIED, or RESERVED_FAILED and count defaults to zero.
        observed: >-
          Sanitizer code maps these to attempt one, but no direct regression test
          proves all legacy dispositions and terminal behavior.
        required_outcome: "Add explicit pre-counter migration tests for every required disposition."
        verification: >-
          Migration tests cover legacy PENDING, POSTED, PERMISSION_DENIED, and
          RESERVED_FAILED dispositions and sanitize each zero counter to one.
      - id: "RV-017"
        severity: "Medium"
        status: "open"
        file: "BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/batterynotifierandroidwearapp/domain/presentation/WearDisplayTimeline.kt"
        location: "WearDisplayTimelineMapper.map lines 36-45; Tile and complication timeline rendering"
        requirement_refs: ["WDS-001", "CPS-001", "AC-005"]
        scenario: >-
          Receive a phone state, then view the Tile or complication after 6,
          10, and 60 minutes without another DataItem.
        observed: >-
          The cached Delayed state is calculated once at the two-minute boundary
          and the Stale state once at five minutes. Tile relative age therefore
          remains five minutes indefinitely; complication delayed text similarly
          remains two minutes, and stale description omits the last-update time.
        required_outcome: >-
          Use bounded minute timeline entries, a dynamic time representation, or
          an absolute last-update value so displayed age remains truthful. Add
          6-, 10-, and 60-minute Tile/complication regressions.
        verification: null
      - id: "RV-018"
        severity: "Low"
        status: "open"
        file: ".agents/work-items/bn-001-phone-to-watch-battery-sync/state.yaml"
        location: "spec_refs"
        requirement_refs: ["ADR-014", "PPS-001"]
        scenario: "Resume BN-001 using only the required-reading order in AGENTS.md."
        observed: >-
          permissions-and-privacy-specification.md is normative evidence for
          RV-014 and ADR-014 and changed in this candidate, but is absent from
          spec_refs, so future role handoffs do not automatically read it.
        required_outcome: "Add docs/permissions-and-privacy-specification.md to spec_refs."
        verification: null

