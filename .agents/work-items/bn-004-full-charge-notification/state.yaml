review_findings:
  - id: "RV-001"
    severity: "High"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/
      batterynotifierandroidwearapp/platform/wearable/
      GooglePlayServicesThresholdChangeRequestGateway.kt
    violated_requirement: "FR-029, RSK-013, wear-os-integration-specification compatibility"
    scenario: >-
      Pair the new Wear app with a BN-002-era Mobile that advertises only
      battery_notifier_threshold_writer. Wear enables the full-charge control,
      sends an unknown message path, and the setting never changes.
    required_outcome: >-
      Advertise and query a dedicated versioned Mobile capability for the
      full-charge setting request, leaving the threshold capability unchanged.
  - id: "RV-002"
    severity: "High"
    status: "verified_closed"
    location: >-
      BatteryNotifierAndroidWearApp/app/src/main/java/com/magicitengineer/
      batterynotifierandroidwearapp/presentation/MainActivity.kt
    violated_requirement: "FR-029 and dedicated BN-004 capability compatibility"
    scenario: >-
      Pair new Wear with an old Mobile that exposes the threshold writer only.
      The full-charge button is enabled from thresholdWriterAvailable, but its
      dedicated capability lookup fails and the requested change never occurs.
    required_outcome: >-
      Track full-charge writer availability independently using
      battery_notifier_full_charge_setting_writer_v1 and disable only that
      control when the dedicated capability is unavailable.
  - id: "RV-003"
    severity: "High"
    status: "verified_closed"
    location: "BatteryNotifierAndroidMobileApp/app/src/main/AndroidManifest.xml"
    violated_requirement: "FR-029, AC-021, TC-E087, MessageClient fixed-path routing"
    scenario: >-
      Wear sends /battery-notifier/v1/change-full-charge-setting, but Google Play
      services cannot dispatch it because the Mobile listener manifest omits the
      corresponding MESSAGE_RECEIVED data path.
    required_outcome: >-
      Register the exact path and keep a regression contract for every supported
      incoming MessageClient route.

