    resolution: "ADR-015 was approved by the human on 2026-07-29."
  - id: "BLK-006"
    type: "phase_return_limit"
    status: "resolved"
    summary: >-
      The fifth failure-driven Review -> Implementation return was reached when
      IMP-017 omitted the exact RV-010 missing-pending-and-result regression
      fixture required by the finding and transition matrix.
    unblock_condition: >-
      Human explicitly prioritizes and authorizes a resume approach, such as one
