schema_version: 1

work_item:
  id: "BN-012"
  slug: "bn-012-release-r8-optimization"
  title: "Enable R8 and resource optimization for Mobile and Wear releases"
  scope: >-
    Enable R8 code optimization and resource shrinking for the Mobile and Wear
    release variants, preserve debug behavior, generate retrace mapping evidence,
    and verify both independent Gradle projects without changing runtime contracts.

status: "awaiting_human"
current_phase: "human_verification"
current_role: "human"
current_actor:
  type: "human"
  id: "user"

last_transition:
  from_phase: "test"
  to_phase: "human_verification"
  reason: >-
    TEST-012-01 and TC-E104 passed independent cached Gradle reruns and artifact
    verification. TC-E105 requires correctly versioned, signed optimized releases
    and mandatory real devices, so it remains Human-owned and Blocked.

spec_refs:
  - "docs/product-requirements.md"
  - "docs/functional-requirements.md"
  - "docs/release-build-optimization-specification.md"
  - "docs/test-plan-and-cases.md"

affected_components:
  - "BatteryNotifierAndroidMobileApp"
  - "BatteryNotifierAndroidWearApp"
  - "docs"

phase_tasks:
  specification:
    status: "complete"
    tasks:
      - id: "SPEC-012-01"
        title: "Define release optimization contract, exclusions, acceptance criteria, and tests"
        status: "complete"
      - id: "SPEC-012-02"
        title: "Align normative document metadata and documentation index"
        status: "complete"
  implementation:
    status: "complete"
    tasks:
      - id: "IMP-012-01"
        title: "Enable R8 code optimization and resource shrinking for Mobile release"
        status: "complete"
      - id: "IMP-012-02"
        title: "Enable R8 code optimization and resource shrinking for Wear release"
        status: "complete"
      - id: "IMP-012-03"
        title: "Add deterministic release optimization contract tests"
        status: "complete"
  review:
    status: "complete"
    tasks:
      - id: "RV-012-01"
        title: "Review R8 scope, keep rules, generated metadata, and user-change preservation"
        status: "complete"
  test:
    status: "complete"
    tasks:
      - id: "TEST-012-01"
        title: "Run Mobile and Wear automated gates sequentially and inspect release artifacts"
        status: "complete"
  human_verification:
    status: "pending"
    tasks:
      - id: "HV-012-01"
        title: "Smoke-test optimized release candidates on required real devices"
        status: "pending"

decisions_needed: []

decisions:
  - id: "DEC-012-01"
    status: "resolved"
    decision: >-
      Apply R8 and resource shrinking only to release variants in both independent
      applications; debug variants remain unoptimized.
    rationale: >-
      This follows the human request and Android's release-only optimization guidance
      while preserving the existing development and test workflow.
    decided_by: "human-user"
    decided_at: "2026-08-16T20:35:53+09:00"
  - id: "DEC-012-02"
    status: "resolved"
    decision: >-
      Use proguard-android-optimize.txt, AGP full mode defaults, and the AGP 8.13
      optimized resource shrinking pipeline. Add no blanket keep rule without a
      reproducible R8 or runtime failure.
    rationale: >-
      Broad keep rules would silently reduce optimization and are not supported by
      current evidence.
    decided_by: "codex"
    decided_at: "2026-08-16T20:35:53+09:00"

blockers:
  - id: "BLOCK-012-01"
    scope: "TC-E105"
    status: "open"
    condition: >-
      The local optimized AABs are unsigned and both working-tree versionCode values
      are 1; mandatory real-device release candidates are not yet identified.
    unblock_requirement: >-
      Human produces approved distinct-version Mobile/Wear candidates signed by the
      same release certificate series and runs them on Pixel 10 Pro Fold and Pixel Watch 4.

findings:
  - id: "RV-012-001"
    severity: "Low"
    status: "closed_fixed_verified"
    location: "docs/functional-requirements.md:1-5; docs/documentation-index.md"
    violated_requirement: "AGENTS.md documentation traceability and RBO-001 discoverability"
    scenario: >-
      RBO-001 and NFR-021 were added on 2026-08-16, but FRS-001 still reports version
      0.7 and last update 2026-08-12, while the documentation index omits RBO-001.
    required_outcome: >-
      Update FRS-001 metadata and add RBO-001 to the document index with the current
      index update date; do not alter the approved optimization behavior.
    fix_evidence: >-
      FRS-001 now reports version 0.8 and 2026-08-16. documentation-index.md now
      reports 2026-08-16 and links RBO-001 with its release optimization scope.
    verification: >-
      Review re-read both files and ran scoped diff checks. The metadata and index
      entry match RBO-001, and no behavior or implementation changed.

risks:
  - id: "RISK-012-01"
    description: "R8 can remove or rename code reached through reflection or platform callbacks."
    mitigation: >-
      Build both release variants, retain generated mapping files, run full affected
      automated gates, and require optimized-release runtime smoke tests.
    disposition: "open_pending_verification"
  - id: "RISK-012-02"
    description: "The working tree contains pre-existing user changes in both app build files and IDE configuration."
    mitigation: >-
      Limit edits to the release blocks and project Gradle properties; preserve versionCode,
      IDE, signing, release-directory, and root ignore changes unchanged.
    disposition: "controlled"
  - id: "RISK-012-03"
    description: >-
      The verified local optimized AABs are unsigned and both current working-tree
      versionCode values are 1, while the compatibility matrix requires distinct
      Mobile even and Wear odd versionCode series for one Play listing.
    mitigation: >-
      Before TC-E105 or Play upload, Human produces Mobile/Wear optimized candidates
      with approved distinct version codes and the same approved release signing
      certificate series, then retains the mapping generated by those exact builds.
    disposition: "open_pending_human_release_build"

evidence:
  - id: "EVID-012-01"
    type: "official_documentation"
    result: "verified"
    summary: >-
      Android release optimization guidance was checked on 2026-08-16. For AGP below
      9.3 it recommends isMinifyEnabled=true, isShrinkResources=true, and
      proguard-android-optimize.txt; AGP 8.12/8.13 requires the optimized resource
      shrinking property to opt into the new pipeline.
    source: "https://developer.android.com/topic/performance/app-optimization/enable-app-optimization?hl=ja"
  - id: "EVID-012-02"
    type: "repository_inspection"
    result: "verified"
    summary: >-
      Both release variants had isMinifyEnabled=false, no isShrinkResources setting,
      and template-only app ProGuard files. No specification or history recorded a
      compatibility reason for disabling R8.
  - id: "EVID-012-03"
    type: "implementation"
    result: "complete"
    summary: >-
      Mobile and Wear release blocks now enable minification and resource shrinking;
      both project properties opt into AGP 8.13 optimized resource shrinking. Debug,
      application IDs, versionCode working-tree values, signing files, and IDE changes
      were not modified by BN-012.
    artifacts:
      - "BatteryNotifierAndroidMobileApp/app/build.gradle.kts"
      - "BatteryNotifierAndroidMobileApp/gradle.properties"
      - "BatteryNotifierAndroidWearApp/app/build.gradle.kts"
      - "BatteryNotifierAndroidWearApp/gradle.properties"
      - "BatteryNotifierAndroidMobileApp/app/src/test/java/com/magicitengineer/batterynotifierandroidmobileapp/ReleaseOptimizationContractTest.kt"
      - "BatteryNotifierAndroidWearApp/app/src/test/java/com/magicitengineer/batterynotifierandroidwearapp/ReleaseOptimizationContractTest.kt"
  - id: "EVID-012-04"
    type: "release_artifact"
    result: "verified"
    summary: >-
      Mobile mapping.txt is 50,816,131 bytes and AAB is 7,100,022 bytes; Wear
      mapping.txt is 38,720,748 bytes and AAB is 5,017,402 bytes. Both AABs contain
      BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map and
      BUNDLE-METADATA/com.android.tools/r8.json.
    artifacts:
      - "BatteryNotifierAndroidMobileApp/app/build/outputs/mapping/release/mapping.txt"
      - "BatteryNotifierAndroidMobileApp/app/build/outputs/bundle/release/app-release.aab"
      - "BatteryNotifierAndroidWearApp/app/build/outputs/mapping/release/mapping.txt"
      - "BatteryNotifierAndroidWearApp/app/build/outputs/bundle/release/app-release.aab"
  - id: "EVID-012-05"
    type: "review"
    result: "pass"
    summary: >-
      RV-012-01 reviewed the scoped build configuration, project properties, contract
      tests, mappings, AAB metadata, documentation, and pre-existing working-tree
      changes. Mobile/Wear AAB mapping entries exactly match their local mapping SHA-256.
      RV-012-001 was fixed and verified. Open findings by severity: 0/0/0/0.
  - id: "EVID-012-06"
    type: "test"
    result: "pass_with_human_gate"
    summary: >-
      Test reran Mobile and Wear test/lint/assembleRelease/bundleRelease sequentially:
      Mobile BUILD SUCCESSFUL in 27s and Wear BUILD SUCCESSFUL in 15s. Artifact hashes,
      embedded mapping equality, and r8.json were reverified. Both local AABs have zero
      JAR signature entries and are test evidence only, not publish-ready candidates.

