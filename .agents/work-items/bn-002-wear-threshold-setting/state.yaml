decisions_needed:
  - id: "DEC-005"
    owner: "human"
    status: "approved"
    question: >-
      Approve ADR-015: Wear may initiate a threshold change through a
      request/result MessageClient exchange, while Mobile alone validates,
      persists, orders, and publishes the effective setting.
    proposed_answer: >-
      Approve. This meets the requested Wear editing experience without
      introducing a second settings writer. Disconnected requests are not
      auto-applied later: the draft remains on Wear and the user explicitly
      retries after reconnection.
    decision: >-
      Approved by the human on 2026-07-29 with the explicit direction to
      proceed to implementation.
    alternatives:
      - >-
        Make Wear a second durable writer and define bidirectional
        last-write/conflict resolution. This materially increases state,
        migration, race, and recovery complexity.
      - >-
        Queue a durable Wear DataItem command for automatic application after
        reconnection. This improves offline convenience but can apply a stale
        setting later without a fresh user action.

