decisions_needed:
  - id: "DEC-001"
    title: "Select the final common application ID for Mobile and Wear"
    owner: "human"
    status: "approved"
    decided_at: "2026-07-22T13:57:48+09:00"
    decided_by: "human"
    decision: >-
      Use com.magicitengineer.batterynotifier as the common Mobile/Wear
      application ID while retaining the current Kotlin namespaces. Use the
      same debug signing identity and the same Play App Signing certificate
      lineage for release. Distribute both form factors from one Google Play
      listing with non-overlapping version codes, accept reinstall without
      development-data migration, and never store signing secrets in the
      repository.
    blocks: []
    notes: >-
      The current Mobile and Wear template application IDs differ. Data Layer
      requires the same package identity and signing identity.
  - id: "DEC-002"
    title: "Confirm the first distribution channel and foreground-service policy path"
    owner: "human"
    status: "approved"
    decided_at: "2026-07-22T09:05:53+09:00"
    decided_by: "human"
    decision: >-
      Use Google Play distribution and ADR-006 specialUse Foreground Service.
      Implementation is authorized to add the required FGS permissions,
      specialUse manifest property, stoppable ongoing notification, runtime
      ACTION_BATTERY_CHANGED receiver, and reboot/package-update recovery.
      Play Console declaration, explanation, demo video, and policy review are
      mandatory before publication.
    blocks: []
    notes: >-
      POST_NOTIFICATIONS declaration and request UX remain outside this
      approval and require separate DEC-004 human approval.
  - id: "DEC-003"
    title: "Define the Wear notification post-failure retry limit and triggers"
    owner: "specification"
    status: "open"
    blocks:
      - "IMP-005 completion"
    notes: >-
      NBR-001 requires bounded retry after RESERVED_FAILED but does not define
      the attempt limit or retry triggers. The implementation may post once and
      persist POSTED, PERMISSION_DENIED, or RESERVED_FAILED, but automatic retry
      remains excluded until the normative behavior is specified.
  - id: "DEC-004"
    title: "Approve POST_NOTIFICATIONS declaration and permission UX"
    owner: "human"
    status: "approved"
    decided_at: "2026-07-22T13:57:48+09:00"
    decided_by: "human"
    decision: >-
      Declare android.permission.POST_NOTIFICATIONS in both apps. Request it
      separately on each device only after an explanation and an explicit user
      action, never automatically at initial launch. Continue monitoring,
      persistence, and synchronization after denial or dismissal; avoid repeat
      dialogs and provide permission status plus a system notification-settings
      action. Approval is limited to notification permission and its UX.
    blocks: []
    notes: >-
      Notification posting code checks the runtime permission and persists a
      user-visible PERMISSION_DENIED outcome, but this increment deliberately
      does not add the permission declaration or request flow without explicit
      human approval.

blockers: []

