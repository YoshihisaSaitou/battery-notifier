schema_version: 1

work_item:
  id: "BN-009"
  slug: "bn-009-complication-state-icons"
  title: "Complication battery state icons and WFF compatibility"
  scope: >-
    Provide the phone battery percentage with official Google Material Symbols
    for normal, charging, and low-battery states in compatible Watch Face Format
    v1 through v5 complication slots. Charging takes precedence at 20 percent
    or below. The watch face remains responsible for final rendering.

status: "awaiting_human"
current_phase: "human_verification"
current_role: "human"
current_actor:
  type: "human"
  id: "human-user"

last_transition:
  from_phase: "test"
  to_phase: "human_verification"
  reason: >-
    TST-007 accepted the automated contract evidence with no product failure
    and separated unavailable WFF runtime and Pixel Watch 4 cases as Not Run.

spec_refs:
  - "docs/product-requirements.md"
  - "docs/functional-requirements.md"
  - "docs/complication-specification.md"
  - "docs/wear-os-display-specification.md"
  - "docs/localization-specification.md"
  - "docs/test-plan-and-cases.md"
  - "docs/compatibility-matrix.md"

affected_components:
  - "Wear complication data source and manifest"
  - "Wear complication monochromatic drawable resources"
  - "Wear complication JVM tests"
  - "Normative complication and test specifications"

phase_tasks:
  specification:
    - id: "SPEC-022"
      status: "completed"
      summary: >-
        Record compatible WFF v1..5 scope, SHORT_TEXT/RANGED_VALUE/LONG_TEXT
        data fields, official Material Symbols, state precedence, freshness,
        accessibility, and acceptance criteria.
    - id: "SPEC-023"
      status: "completed"
      summary: >-
        Align the compatibility matrix with approved LONG_TEXT and WFF v1..5
        compatible-slot scope without changing product behavior.
  implementation:
    - id: "IMP-027"
      status: "completed"
      summary: >-
        Add the three monochromatic Material Symbol vectors, state selection,
        LONG_TEXT support, and automated regression coverage.
    - id: "IMP-028"
      status: "completed"
      summary: >-
        Verify the compatibility-matrix correction requires no production or
        test change and that code/docs remain aligned.
  review:
    - id: "RV-015"
      status: "completed"
      summary: >-
        Review specification alignment, icon provenance and geometry, all state
        boundaries, complication fields, accessibility, and unrelated scope.
  test:
    - id: "TST-007"
      status: "completed"
      summary: >-
        Run targeted and full Wear unit tests and lint; record WFF/runtime and
        Pixel Watch cases as Not Run unless actually executed.
  human_verification:
    - id: "HUM-009"
      status: "pending"
      summary: >-
        Inspect compatible WFF slots on Pixel Watch 4 41mm and 45mm in active
        and ambient modes and decide final acceptance.

decisions_needed: []
approved_decisions:
  - id: "DEC-BN009-001"
    decision: >-
      Package official Google Material Symbols as app Vector Drawables and pass
      them as complication monochromatic images.
    approved_by: "human-user"
    approved_at: "2026-08-10T18:59:02+09:00"
  - id: "DEC-BN009-002"
    decision: >-
      Charging takes precedence over the low-battery icon when the phone is at
      or below 20 percent while charging.
    approved_by: "human-user"
    approved_at: "2026-08-10T18:59:02+09:00"
  - id: "DEC-BN009-003"
    decision: >-
      WFF compatibility means v1 through v5 slots accepting a supported
      complication type; identical rendering on every third-party face is out
      of scope.
    approved_by: "human-user"
    approved_at: "2026-08-10T18:59:02+09:00"

blockers: []
risks:
  - id: "RSK-019"
    summary: >-
      A watch face can omit optional image or text fields or render them in a
      different arrangement even when the data source supplies both.
    mitigation: >-
      Guarantee the returned data contract, test representative WFF fixtures,
      and keep identical third-party rendering explicitly out of scope.

evidence:
  - id: "HUM-BN009-001"
    type: "human_approval"
    summary: >-
      Human approved all three proposed specification decisions on 2026-08-10.
  - id: "REF-BN009-002"
    type: "official_asset_provenance"
    summary: >-
      Material Symbols Rounded battery_full, battery_alert, and
      battery_charging_full 24px Android vectors were retrieved from the
      google/material-design-icons repository. Path geometry is retained;
      only the monochromatic fill token is fixed for complication tinting.
  - id: "IMP-BN009-003"
    type: "implementation_impact_analysis"
    summary: >-
      No persisted state, Data Layer contract, writer, permission, application
      ID, or signing behavior changed. Production requests create a resource-
      backed MonochromaticImage before building SHORT_TEXT, RANGED_VALUE, or
      LONG_TEXT data. No-data requests still return NoDataComplicationData.
    state_matrix:
      - "charging=true, level=0..100 -> battery_charging_full"
      - "charging=false, level=0..20 -> battery_alert"
      - "charging=false, level=21..100 -> battery_full"
      - "stale/delayed changes text and description, not icon selection"
      - "no valid data -> NoDataComplicationData without a state icon"
    sibling_paths_inspected:
      - "active request and preview/default request path"
      - "timeline entry construction"
      - "SHORT_TEXT, RANGED_VALUE, and LONG_TEXT builders"
      - "manifest supported-type declaration"
      - "Fresh, Delayed, Stale, clock-warning, and monitoring-off descriptions"
  - id: "REV-BN009-004"
    type: "independent_review"
    summary: >-
      Reviewed the complete BN-009 working-tree scope independently of test
      totals. All production calls supply a resource-backed monochromatic image;
      charging is evaluated before the fixed low boundary; No Data and existing
      freshness/accessibility paths remain intact. Manifest and vector XML
      contracts match the specification. No review finding was opened.
  - id: "BLD-BN009-005"
    type: "test_build_identity"
    summary: >-
      Uncommitted BN-009 Wear working tree; applicationId
      com.magicitengineer.batterynotifier, versionCode 3, versionName 1.0,
      minSdk 30, targetSdk 36, debug signing configuration. No personal device
      or signing identifier was recorded.

test_results:
  - id: "CHK-BN009-001"
    command: >-
      gradlew.bat testDebugUnitTest --tests '*MainComplicationDataTest'
      --rerun-tasks '-Pkotlin.compiler.execution.strategy=in-process'
    status: "fail"
    result: >-
      Production Kotlin compiled, but 4/6 JVM tests failed before assertions
      because MonochromaticImage.PLACEHOLDER initializes Android
      Icon.createWithResource, which is not mocked in local JVM tests.
    failure_signature: >-
      ExceptionInInitializerError: Method createWithResource in
      android.graphics.drawable.Icon not mocked.
  - id: "CHK-BN009-002"
    command: >-
      cached Gradle 8.13 --offline testDebugUnitTest --tests
      '*MainComplicationDataTest' --rerun-tasks
      '-Pkotlin.compiler.execution.strategy=in-process'
    status: "pass"
    result: >-
      6 tests, 0 skipped, 0 failures, 0 errors. The fixture keeps Android Icon
      creation out of JVM tests while production compilation verifies the
      resource-backed MonochromaticImage path.
  - id: "CHK-BN009-003"
    command: >-
      cached Gradle 8.13 --offline test
      '-Pkotlin.compiler.execution.strategy=in-process'
    status: "pass"
    result: >-
      Wear debug 89 tests and release 89 tests; 0 skipped, 0 failures, and
      0 errors in both variants.
  - id: "CHK-BN009-004"
    command: >-
      cached Gradle 8.13 --offline lint
      '-Pkotlin.compiler.execution.strategy=in-process'
    status: "pass"
    result: "Wear lint completed with 0 errors and 31 warnings."
  - id: "CHK-BN009-005"
    command: >-
      cached Gradle 8.13 --offline testDebugUnitTest --tests
      '*MainComplicationDataTest' after an indentation-only edit
    status: "blocked"
    result: >-
      The command produced no output before the 124-second execution timeout.
      Its two child Java processes were stopped. This did not replace or
      invalidate CHK-BN009-002/003 because the only intervening source change
      was whitespace and the prior full gate compiled and tested the same code.
  - id: "CHK-BN009-006"
    command: >-
      rg LONG_TEXT/WFF/third-party terms across compatibility, normative specs,
      test plan, manifest, and MainComplicationService; git diff --check
    status: "pass"
    result: >-
      Compatibility statements match all three implemented types and the WFF
      scope. The only newly reported whitespace was removed before handoff.
  - id: "TC-U039"
    requirements: "AC-027, FR-051, FR-055"
    status: "pass"
    result: >-
      MainComplicationDataTest verified 21 non-charging -> battery_full,
      20/0 non-charging -> battery_alert, and 20/100 charging ->
      battery_charging_full. Charging precedence and the inclusive low boundary
      passed.
  - id: "TC-U040"
    requirements: "AC-027, AC-028, FR-050, FR-057, FR-058"
    status: "pass"
    result: >-
      Compiled production branches set the supplied MonochromaticImage for
      SHORT_TEXT, RANGED_VALUE, and LONG_TEXT. JVM tests passed percentage,
      title/status, and dynamic stale-description contracts; pure resource
      mapping was tested separately. Actual platform icon rendering remains in
      TC-E095/TC-E096 and is not inferred from this pass.
  - id: "TC-E095"
    requirements: "AC-028, FR-056"
    status: "not_run"
    result: >-
      No WFF v1..5 runtime verification face/fixture was present in the
      repository or available test environment. Requires compatible WFF
      fixtures exposing SHORT_TEXT, RANGED_VALUE, and LONG_TEXT slots.
  - id: "TC-E096"
    requirements: "AC-027, AC-028, PR-008"
    status: "not_run"
    result: >-
      adb was not available on PATH and no Pixel Watch 4 41mm/45mm device
      evidence was supplied. Requires active/AOD, Japanese/English, TalkBack,
      and 21%/20%/charging checks on the identified build.
review_findings:
  - id: "TST-BN009-F01"
    severity: "Medium"
    status: "verified"
    location: "docs/compatibility-matrix.md section 7"
    violated_requirement: "FR-050 and FR-056"
    scenario: >-
      A tester following the compatibility matrix would treat LONG_TEXT as
      unsupported and would not apply the approved WFF v1..5 boundary.
    required_outcome: >-
      Add LONG_TEXT and define compatibility as supported fields in WFF v1..5
      slots while excluding identical third-party rendering.
    verification_evidence: >-
      Compatibility matrix version 0.2 section 7 lists all three types, WFF
      v1..5 field-level compatibility, unsupported-slot behavior, and the
      third-party rendering exclusion; git diff --check passed.

