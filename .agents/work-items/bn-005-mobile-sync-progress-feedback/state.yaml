review_findings:
  - id: "RV-005-01"
    severity: "Medium"
    status: "closed_verified"
    location: >-
      BatteryNotifierAndroidMobileApp/app/src/main/java/com/magicitengineer/
      batterynotifierandroidmobileapp/MainActivity.kt manual-sync coroutine
    requirement: "FR-067 / AC-023"
    scenario: >-
      If battery refresh, DataStore, or Data Layer coordination throws a
      non-cancellation exception, retainUntilResult exits before returning a UI
      state and the Compose state remains SYNCING with its action disabled.
    required_outcome: >-
      Preserve structured cancellation, but map unexpected operational
      exceptions to FAILED after the same minimum progress interval and cover
      the exception branch with a deterministic regression test.
    verification: >-
      ManualSyncProgressRetainer rethrows CancellationException, maps other
      Exception values to FAILED, applies the remaining minimum interval, and
      deterministic tests cover both branches. Post-fix test/lint passed.
risks:
  - id: "RISK-005-01"
    description: >-
      A fast or synchronously completing manual-sync path can replace SYNCING
      before Compose draws the intermediate state unless the UI thread is
      released and a bounded minimum presentation interval is enforced.
    mitigation: >-
      Run the coordination work away from the UI dispatcher and retain the
      in-progress state for a short specified minimum interval.

