        cancellation and one-time recovery corrective change.
      failure_signature: >-
        A new notification PENDING created after process recovery has already
        completed can survive service cancellation after gateway return and
        before completion persistence, with no same-process recovery trigger.
      root_cause_hypothesis: >-
        NonCancellable protection covers only a CancellationException thrown by
        gateway.post; it does not cover cancellation at repository completion,
        while recoverInterruptedNotificationOnce permanently closes recovery
        for the remainder of the process.
      corrective_change: >-
        Implementation added gateway-cancellation completion and a one-time
        previous-process PENDING recovery before listener processing.
      result: >-
        fail; the post-return/completion-write cancellation boundary remains
        unprotected and is not covered by a service-cancellation regression.
