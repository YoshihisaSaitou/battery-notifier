decisions_needed: []

decisions:
  - id: "DEC-011-01"
    status: "resolved"
    decision: >-
      Keep the feature graphic text-free so the default graphic can be shared
      by Japanese and English listings without localization drift.
    rationale: >-
      Google Play can show the default-language graphic for translations, and
      text-free artwork avoids duplicate copy and localization requirements.
    decided_by: "codex"
    decided_at: "2026-08-15T22:54:23+09:00"

blockers: []

risks:
  - id: "RISK-011-01"
    description: "Google Play may crop the feature graphic differently across promotional surfaces."
    mitigation: "Keep the focal point and all important elements near the center; use edges only for background accents."
    disposition: "open_pending_visual_review"
  - id: "RISK-011-02"
    description: "Generated artwork may introduce text, trademarks, or misleading device imagery."
    mitigation: "Use a constrained text-free prompt, inspect the raster, and reject or regenerate any noncompliant output."
    disposition: "closed_reviewed_no_prohibited_element_observed"

findings: []
evidence:
  - id: "EVID-011-01"
    type: "official_documentation"
    result: "verified"
    summary: >-
      Google Play preview-asset and metadata guidance was checked on 2026-08-15:
      icon 512 x 512 RGBA PNG at most 1,024 KB; feature graphic 1,024 x 500
      RGB PNG/JPEG with no alpha, with important content near the center.
    source: "https://support.google.com/googleplay/android-developer/answer/9866151"
  - id: "EVID-011-02"
    type: "implementation"
    result: "complete"
    summary: >-
      Exported the Play icon unchanged from the approved SVG and generated a
      text-free brand extension for the feature graphic, then center-cropped and
      flattened it with the deterministic exporter.
    artifacts:
      - "docs/assets/google-play/google-play-app-icon.png"
      - "docs/assets/google-play/google-play-feature-graphic.png"
      - "docs/assets/google-play/asset-manifest.json"
      - "docs/assets/google-play/provenance.md"
      - "scripts/generate-google-play-assets.cjs"

test_results:
  - id: "CHK-011-01"
    command: >-
      bundled node with sharp: node scripts/generate-google-play-assets.cjs
    result: "pass"
    summary: >-
      Icon is PNG 512 x 512, 4 channels with alpha, 7,329 bytes. Feature graphic
      is PNG 1,024 x 500, 3 channels without alpha, 518,036 bytes. SHA-256 values
      were written to asset-manifest.json.
  - id: "CHK-011-02"
    command: "git diff --check"
    result: "pass"
    summary: >-
      No whitespace errors; only the pre-existing line-ending warning for the
      user-modified BN-010 state file was reported.
  - id: "CHK-011-03"
    command: >-
      node scripts/generate-google-play-assets.cjs followed by
      node scripts/validate-google-play-assets.cjs and SHA-256 comparison
    result: "pass"
    summary: >-
      Regeneration preserved both final SHA-256 values. The validator confirmed
      icon PNG 512 x 512 RGBA at 7,329 bytes and feature PNG 1,024 x 500 RGB at
      518,036 bytes, with manifest hashes and both alt texts present.
  - id: "PLAY-CONSOLE-UPLOAD"
    result: "not_run"
    summary: "Actual Play Console upload and server-side acceptance require Human action."

