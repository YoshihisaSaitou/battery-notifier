risks:
  - id: "RISK-001"
    severity: "high"
    summary: "Data Layer will not function until package and signing identities match."
    mitigation: "Resolve DEC-001 before integration testing and test matching debug/release pairs."
  - id: "RISK-002"
    severity: "high"
    summary: "The continuous battery-monitoring specialUse FGS may require distribution-policy changes."
    mitigation: "Resolve DEC-002 and perform policy review before release approval."
  - id: "RISK-003"
    severity: "medium"
    summary: "Disconnected event delivery can create a misleading late Wear notification."
    mitigation: "Enforce event expiry and verify reconnect before/after expiry."

