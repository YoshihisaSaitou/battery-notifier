work_item:
  id: "BN-003"
  slug: "bn-003-wear-threshold-slider"
  title: "Wear threshold slider adjustment"
  scope: >-
    Replace the Wear threshold editor's separate increment/decrement buttons
    with a Wear-native non-segmented slider that adjusts the 5..100 percent
    draft in one-percent steps, preserves tap controls, leaves crown input for
    screen scrolling, and sends no threshold request until the existing
    explicit Save action.

